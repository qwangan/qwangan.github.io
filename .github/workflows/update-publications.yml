name: Update publications

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Use 'missing' to fill blanks/finalize provisional venues or 'refresh' to update existing fields"
        required: true
        default: missing
        type: choice
        options:
          - missing
          - refresh
  schedule:
    - cron: "37 9 * * *"

permissions:
  contents: write
  actions: write
  pages: write

# Shared with the CV builder so the two bot jobs cannot push stale checkouts.
concurrency:
  group: website-content
  cancel-in-progress: false

jobs:
  update-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # A queued run's event SHA may predate another bot's commit.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-publications.txt

      - name: Test publication discovery
        run: python -m unittest discover -s tests -v

      - name: Discover papers and refresh publication metadata
        id: update
        continue-on-error: true
        run: python scripts/update_publications.py --write --discover --fail-on-error --mode "${{ github.event.inputs.mode || 'missing' }}"

      - name: Commit publication metadata when changed
        id: commit
        run: |
          if git diff --quiet -- _pages/publications.yml; then
            echo "No publication changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _pages/publications.yml
          git commit -m "Discover papers and update publication metadata"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the updated website
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Rebuild the CV after automatic publication changes
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-cv.yml --ref "$GITHUB_REF_NAME"

      - name: Report source failures
        if: always() && steps.update.outcome == 'failure'
        run: |
          echo "::error::Some publication sources failed. Successful updates were saved; inspect the discovery log and retry."
          exit 1
